[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pool-evaluator"
version = "1.0.0"
description = "Paper-aligned PoolEvaluator implementation for Text2SQL, image, and node classification model pools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = [
  "accelerate>=1.0",
  "huggingface-hub>=0.30",
  "peft>=0.14",
  "safetensors>=0.5",
  "timm>=1.0",
  "torch>=2.2",
  "torch-geometric>=2.6",
  "transformers>=4.51",
]
judges = ["anthropic>=0.70", "openai>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pooleval-models = "pooleval.models:main"
pooleval-db = "pooleval.databases:main"
pooleval-run = "pooleval.pipeline:main"

[tool.setuptools]
packages = ["pooleval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
