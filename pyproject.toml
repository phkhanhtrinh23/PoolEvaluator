[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pooleval"
version = "0.1.0"
description = "PoolEval: label-free joint evaluation of a Text-to-SQL model pool via anchored, correlation-aware latent-correctness inference."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.1", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["pooleval", "pooleval.data", "baselines", "baselines.llm_judge"]
