# Default PoolEval configuration (mirrors pooleval/config.py and the paper's
# default diverse M=12 pool over 7 provenance groups, moderate-shift regime).
pool:
  M: 12                # pool size
  N: 400               # unlabeled items (questions)
  n_groups: 7          # provenance groups (shared pretrained base)

generative:
  acc_lo: 0.30         # true model accuracy range
  acc_hi: 0.70
  diff_std: 1.6        # item difficulty spread
  collusion: 0.55      # within-group shared-error probability
  universal_error: 0.30  # cross-pool shared-error (gauge trap)

anchors:
  prior_bias: 0.06     # shift-induced bias of the seen prior
  prior_noise: 0.07
  verifier_acc: 0.72   # P(verifier points at the true class)
  verifier_strength: 2.0

kernel:                # graded execution-equivalence kernel precision/recall
  level: L2            # L0 exact | L1 canonical | L2 multi-instance
  recall: {L0: 0.74, L1: 0.95, L2: 0.97}
  precision: {L0: 0.98, L1: 0.95, L2: 0.99}

inference:
  em_iters: 40
  fusion: precision    # precision | prior_only | agreement_only
  use_prior: true
  use_verifier: true
  use_correlation: true

eval:
  seeds: 5
